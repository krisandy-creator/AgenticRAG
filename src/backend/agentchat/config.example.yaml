# 服务配置
server:
  host: "127.0.0.1"
  port: 7860
  project_name: "OmniChat"
  version: "2.4.0"

# 数据库配置：MySQL (请根据实际配置更改 endpoint) 如果使用Docker启动服务，请将localhost改成@mysql:3306...
# 格式：mysql+pymysql://<user>:<password>@<host>:<port>/<database>
mysql:
  endpoint: "mysql+pymysql://<user>:<password>@localhost:3306/agentchat"
  async_endpoint: "mysql+aiomysql://<user>:<password>@localhost:3306/agentchat"

# 缓存配置：Redis
redis:
  endpoint: "redis://:<password>@localhost:6379"

# 多模型服务配置 (LLM、Embedding、Rerank)
multi_models:
  # 对话模型配置
  conversation_model:
    api_key: ""
    base_url: "https://ws-gyyqn91a8kamn1ka.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen3.7-plus"
  # 工具调用/Function Call 模型配置
  tool_call_model:
    api_key: ""
    base_url: "https://ws-gyyqn91a8kamn1ka.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen3.6-flash"
  # 复杂推理模型配置
  reasoning_model:
    api_key: ""
    base_url: "https://ws-gyyqn91a8kamn1ka.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen3.7-plus"
  # 文生图模型配置
  text2image:
    api_key: ""
    base_url: "https://ws-gyyqn91a8kamn1ka.cn-beijing.maas.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis"
    model_name: "wan2.7-image"
  # 多模态 (视觉) 模型配置
  qwen_vl:
    api_key: ""
    base_url: "https://ws-gyyqn91a8kamn1ka.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen3-vl-flash"

  # Embedding 模型配置 (用于向量化)
  embedding:
    api_key: ""
    base_url: "https://ws-gyyqn91a8kamn1ka.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    model_name: "text-embedding-v4"

  # Rerank 模型配置 (用于重排序召回结果)
  rerank:
    api_key: ""
    base_url: "https://ws-gyyqn91a8kamn1ka.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen3-vl-rerank"


# 外部工具 (Tool) 配置
tools:
  # 高德地图天气 API 配置
  weather:
    api_key: ""
    endpoint: "https://restapi.amap.com/v3/weather/weatherInfo?parameters"
  # Tavily 联网搜索 API 配置 (注意配额限制)
  tavily:
    api_key: ""
  # SerpApi 上的 Google Search API 配置
  google:
    api_key: ""
  # 使用的是aliyun上的快递查询api
  delivery:
    api_key: ""
    endpoint: "https://qyexpress.market.alicloudapi.com/composite/queryexpress"
  # BoCha 联网搜索 API 配置
  bocha:
    api_key: ""
    endpoint: "https://api.bocha.cn/v1/web-search"



# RAG (检索增强生成) 配置
rag:
  enable_summary: False # 是否对知识库片段进行摘要
  enable_elasticsearch: False # 是否启用 Elasticsearch 进行关键词搜索

  retrival:
    top_k: 5  # 知识库召回的最大数量
    min_score: 0.2 # 知识库召回结果的最小相似度分数阈值

  split:
    chunk_size: 500 # 知识库文档分块的最大字符数
    overlap_size: 100 # 文档分块之间的重叠字符数

  # 多模态 PDF 解析（页窗口 + Vision 并发 + 微批索引）
  multimodal_parse:
    enabled: true
    dpi: 180
    max_pages: 500
    page_batch_size: 20
    vision_max_concurrency_per_doc: 4
    vision_max_retries: 3
    vision_global_limit: 10
    vision_timeout_seconds: 120
    text_layer_min_chars: 80
    blank_page_max_nonwhite_ratio: 0.005
    embedding_batch_size: 32
    embedding_api_batch_size: 10
    embedding_max_concurrency: 5

  # ARQ 文档解析 Worker
  parse_worker:
    max_concurrent_documents: 2
    arq_queue_name: "rag:parse"
    job_timeout_seconds: 7200

  # ES数据库配置，主要做关键词召回
  elasticsearch:
    hosts: "http://127.0.0.1:9200" # Elasticsearch 连接地址。如果 'enable_elasticsearch' 为 False，则不需要填写。

  # 向量数据库配置 (Vector DB)
  vector_db:
    host: "127.0.0.1"
    port: "19530"
    mode: "lite" # 向量库模式: standalone (Milvus), lite (轻量Milvus), chroma (ChromaDB)
    path: ".rag_storage/milvus_lite.db" # Milvus Lite 本地库路径
    collection_name: "global_knowledge_chunks"
    metric_type: "COSINE"
    lite_short_session: true # Lite 模式每次操作后释放连接，配合文件锁支持 API+Worker 多进程
    lite_lock_timeout_seconds: 60 # 等待 Milvus Lite 文件锁的超时时间（秒）

# 阿对象存储 OSS 配置
storage:
  mode: "oss" # or oss

  oss:
    access_key_id: ""
    access_key_secret: ""
    endpoint: "oss-cn-shenzhen.aliyuncs.com"
    bucket_name: "xgzntest01" # OSS 存储桶名称
    base_url: "https://xgzntest01.oss-cn-shenzhen.aliyuncs.com" # 访问基础 URL

  minio:
    access_key_id: ""
    access_key_secret: ""
    endpoint: "127.0.0.1:9000"
    bucket_name: "agentchat" # minio 存储桶名称
    base_url: "http://127.0.0.1:9000/agentchat" # 访问基础 URL

# 默认配置 (如图标 URL, 资源链接)
default_config:
  mcp_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/mcp/mcp.png"
  tool_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/default.png" # 工具默认图标 URL
  agent_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/bot.png" # Agent 默认图标 URL
  mars_daily_url: "https://news.aibase.com/zh/news" # 外部新闻链接
  memory_collection_name: "memory" # 记忆存储的集合名称

# 扩展功能：微信配置 (不添加也可正常运行)
wechat_config:
  token: ""
  app_id: ""
  secret: ""

# 追踪工具 Langfuse 配置 (目前版本可能未应用)
langfuse:
  trace_name: "agentchat"
  host: "https://cloud.langfuse.com"
  public_key: ""
